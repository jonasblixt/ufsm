name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Formatting (Prettier; npm run format fixes it)
        run: npm run format:check
      - name: Type checker for the generated Python
        run: npm install --global pyright@1.1.414
      - name: Rust for the generated Rust (rustc, clippy, rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Go for the generated Go (go, gofmt, go vet)
        uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - name: .NET for the generated C#
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - run: npm test
        env:
          # fail instead of skipping the generated-code tests if gcc/g++, Python, pyright, Rust, Go or .NET is missing
          UFSM_REQUIRE_CC: 1
          UFSM_REQUIRE_CXX: 1
          UFSM_REQUIRE_PYTHON: 1
          UFSM_REQUIRE_PYRIGHT: 1
          UFSM_REQUIRE_RUST: 1
          UFSM_REQUIRE_GO: 1
          UFSM_REQUIRE_DOTNET: 1

  editor:
    name: Editor (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/editor/src-tauri
      - run: npm ci
      - name: Build installers
        # A tag build signs the update packages when the repository has the key (docs/releasing.md); every other
        # build, and a fork without the secret, builds the installers only.
        shell: bash
        env:
          UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          UPDATER_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* && -n "$UPDATER_KEY" ]]; then
            pubkey="$(node -p "require('./apps/editor/src-tauri/tauri.conf.json').plugins.updater.pubkey")"
            if [ -z "$pubkey" ]; then
              echo "::error::TAURI_SIGNING_PRIVATE_KEY is set but plugins.updater.pubkey in tauri.conf.json is empty"
              exit 1
            fi
            export TAURI_SIGNING_PRIVATE_KEY="$UPDATER_KEY"
            export TAURI_SIGNING_PRIVATE_KEY_PASSWORD="$UPDATER_KEY_PASSWORD"
            npm run build -- --config src-tauri/tauri.updater.conf.json
          else
            npm run build
          fi
      - name: Collect the installers (and the update packages with their signatures)
        shell: bash
        run: |
          node apps/editor/scripts/release-assets.ts stage apps/editor/src-tauri/target/release/bundle \
            build/release --version "$(node -p "require('./package.json').version")"
      - uses: actions/upload-artifact@v7
        with:
          name: ufsm-editor-${{ runner.os }}
          path: build/release/
          if-no-files-found: ignore

  release:
    name: Draft release
    # a pushed tag v<version> collects the installers into a draft GitHub release (publish it by hand); with the
    # signing key the release also carries latest.json, which installed apps read once the release is published
    if: startsWith(github.ref, 'refs/tags/v')
    needs: editor
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # release-assets.ts runs as TypeScript (Node 24 strips the types)
          node-version: 24
      - name: Tag matches the version in package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          pattern: ufsm-editor-*
          path: dist
          merge-multiple: true
      - name: latest.json for the updater (only when the installers were signed)
        run: node apps/editor/scripts/release-assets.ts manifest dist --tag "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
      - name: Create the draft release with the installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t files < <(find dist -type f)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no installers found"
            exit 1
          fi
          printf '%s\n' "${files[@]}"
          gh release create "$GITHUB_REF_NAME" "${files[@]}" --draft --verify-tag \
            --title "uFSM ${GITHUB_REF_NAME#v}" --generate-notes
