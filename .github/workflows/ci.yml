name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Formatting (Prettier; npm run format fixes it)
        run: npm run format:check
      - name: Type checker for the generated Python
        run: npm install --global pyright@1.1.414
      - name: Rust for the generated Rust (rustc, clippy, rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: npm test
        env:
          # fail instead of skipping the generated-code tests if gcc, Python, pyright or Rust is missing
          UFSM_REQUIRE_CC: 1
          UFSM_REQUIRE_PYTHON: 1
          UFSM_REQUIRE_PYRIGHT: 1
          UFSM_REQUIRE_RUST: 1

  editor:
    name: Editor (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/editor/src-tauri
      - run: npm ci
      - name: Build installers
        run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: ufsm-editor-${{ runner.os }}
          path: |
            apps/editor/src-tauri/target/release/bundle/**/*.msi
            apps/editor/src-tauri/target/release/bundle/**/*.exe
            apps/editor/src-tauri/target/release/bundle/**/*.dmg
            apps/editor/src-tauri/target/release/bundle/**/*.AppImage
            apps/editor/src-tauri/target/release/bundle/**/*.deb
          if-no-files-found: ignore

  release:
    name: Draft release
    # a pushed tag v<version> collects the installers into a draft GitHub release (publish it by hand)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: editor
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches the version in package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          pattern: ufsm-editor-*
          path: dist
          merge-multiple: true
      - name: Create the draft release with the installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t files < <(find dist -type f)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no installers found"
            exit 1
          fi
          printf '%s\n' "${files[@]}"
          gh release create "$GITHUB_REF_NAME" "${files[@]}" --draft --verify-tag \
            --title "uFSM ${GITHUB_REF_NAME#v}" --generate-notes
